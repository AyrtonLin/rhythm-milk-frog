<script>
/* 节奏小奶蛙 - 机制原型库（每个原型实现一次，各关参数+皮肤差异化）
   机制接口：init(r) / update(r,dt) / draw(r,ctx) / down(r,e) / up(r,e) / miss(r,note)
   runner(r) 提供：cfg chart notes now() pending(win) nextNote() submit(note,tier,opt)
                  frog setPose setExpr powerBar w h u groundY */
(function () {
  const U = RF.util, J = RF.judge;
  const M = RF.mech = {};

  /* 通用：画小奶蛙（含眨眼/影子） */
  M.drawFrog = function (r, ctx, opt) {
    opt = opt || {};
    const f = r.frog;
    if (!opt.noShadow) RF.frog.shadow(ctx, f.x, f.y + 52 * f.s * (opt.shadowK || 1), f.s, opt.jump || 0);
    RF.frog.draw(ctx, {
      x: f.x, y: f.y, s: f.s, face: f.face, pose: f.pose, poseT: f.poseT,
      expr: f.expr, charge: f.charge, beatPhase: r.beatPhase(), prop: f.prop,
      propHand: f.propHand, propAngle: f.propAngle || 0, blink: f.blink
    });
  };

  /* ============ 原型 1：PowerThrow 力量投掷（长按蓄力 + 踩拍松手） ============ */
  M.power = {
    init(r) {
      r.m = { kind: r.cfg.params.kind, charging: null, power: 0, flights: [], sticks: [], netWig: 0, keeper: null, lineFlash: 0 };
      r.frog.prop = r.cfg.params.prop || null;
    },
    layout(r, note) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u, gy = r.groundY;
      const k = r.m.kind, z = note ? note.zone.c : 60;
      if (k === 'basket') return { tx: U.lerp(w * 0.52, w * 0.86, z / 100), ty: h * 0.34 + (note ? (note.aim % 2) * h * 0.05 : 0) };
      if (k === 'goal') return { tx: w * 0.82, ty: gy - h * 0.1, corner: note ? note.aim % 4 : 0 };
      if (k === 'jianzi') return { ty: gy - (z / 100) * h * 0.52 };
      if (k === 'dart') return { tx: U.lerp(w * 0.5, w * 0.87, z / 100), ty: h * 0.4 };
      if (k === 'plane') return { tx: U.lerp(w * 0.45, w * 0.88, z / 100), ty: h * 0.5 };
      if (k === 'star') return { ty: gy - (z / 100) * h * 0.55 };
      return { tx: w * 0.7, ty: h * 0.4 };
    },
    update(r, dt) {
      const m = r.m, now = r.now();
      if (m.charging) {
        m.power = Math.min(100, (now - m.charging.t0) / RF.chart.FULL * 100);
        r.frog.charge = m.power / 100;
        r.setPose('charge', 0.1);
        if (m.power >= 100 && Math.random() < 0.2) RF.sfx.charge(1);
      } else {
        m.power = 0;
        r.frog.charge = Math.max(0, r.frog.charge - dt * 3);
      }
      /* 蓄力条常驻：始终显示当前力度与下一音符目标区间 */
      r.powerBar.show = 1;
      r.powerBar.power = m.power;
      const nn = r.nextNote();
      r.powerBar.zone = nn ? nn.zone : null;
      m.netWig = Math.max(0, m.netWig - dt * 2);
      m.lineFlash = Math.max(0, m.lineFlash - dt * 2);
      /* 飞行物 */
      for (let i = m.flights.length - 1; i >= 0; i--) {
        const f = m.flights[i];
        f.t += dt;
        const k = f.t / f.dur;
        if (k >= 1) {
          this._land(r, f);
          m.flights.splice(i, 1);
        }
      }
      if (m.keeper) { m.keeper.t += dt; if (m.keeper.t > 1) m.keeper = null; }
    },
    _land(r, f) {
      const m = r.m, u = RF.view.u;
      if (f.ok) {
        if (m.kind === 'basket') { RF.sfx.swish(); m.netWig = 1; RF.fx.burst(f.tx, f.ty + 10 * u, '#FFD34D', 10, { speed: 160 }); }
        else if (m.kind === 'goal') { RF.sfx.hit(); RF.fx.confetti(f.tx, f.ty, 14); }
        else if (m.kind === 'jianzi') { RF.sfx.pop(); m.lineFlash = 1; RF.fx.burst(f.tx, f.ty, '#81C784', 12, { speed: 180 }); }
        else if (m.kind === 'dart') { RF.sfx.dart(); RF.fx.burst(f.tx, f.ty, '#EF5350', 8, { speed: 120 }); m.sticks.push({ x: f.tx, y: f.ty, a: f.stickA || 0 }); if (m.sticks.length > 6) m.sticks.shift(); }
      } else {
        RF.sfx.bounce();
        RF.fx.burst(f.tx, f.ty, '#B0BEC5', 6, { speed: 120 });
      }
    },
    down(r, e) {
      if (r.m.charging) return;
      r.m.charging = { id: e.id, t0: r.now() };
      r.m.power = 0;
    },
    up(r, e) {
      const m = r.m;
      if (!m.charging || m.charging.id !== e.id) return;
      const power = m.power;
      m.charging = null;
      const now = r.now();
      const note = r.pending(r.winG);
      const L = this.layout(r, note);
      const from = { x: r.frog.x + 20 * r.frog.s * r.frog.face, y: r.frog.y - 20 * r.frog.s };
      if (note) {
        const tTier = J.timeTier(now - note.t, r.winS);
        const pTier = J.powerTier(power, note.zone);
        const tier = J.worse(tTier, pTier);
        r.submit(note, tier, { x: r.frog.x, y: r.frog.y - 90 * r.frog.s });
        const ok = tier !== 'M';
        const diff = power - note.zone.c;
        if (m.kind === 'basket') {
          r.setPose('throw', 0.45);
          m.flights.push({ kind: 'ball', prop: 'basketball', t: 0, dur: 0.6, fx: from.x, fy: from.y, tx: ok ? L.tx : L.tx + U.clamp(diff, -30, 30) * RF.view.u * 1.6, ty: ok ? L.ty : L.ty + (diff < 0 ? 90 : -40) * RF.view.u, ok });
        } else if (m.kind === 'goal') {
          r.setPose('kick', 0.45);
          const cw = RF.view.w * 0.14, ch = RF.view.h * 0.16;
          const cx = L.tx + ((L.corner % 2) - 0.5) * cw * 0.7;
          const cy = L.ty - (L.corner < 2 ? ch * 0.32 : -ch * 0.32);
          m.keeper = { t: 0, dir: ok ? -(note.dir === 'L' ? 1 : -1) : ((L.corner % 2) - 0.5), save: !ok };
          m.flights.push({ kind: 'ball', prop: 'football', t: 0, dur: 0.55, fx: from.x, fy: from.y, tx: ok ? cx : L.tx + U.clamp(diff, -25, 25) * RF.view.u * 2, ty: ok ? cy : L.ty - ch, ok });
        } else if (m.kind === 'jianzi') {
          r.setPose('kick', 0.4);
          const apex = r.groundY - (power / 100) * RF.view.h * 0.55;
          m.flights.push({ kind: 'up', prop: 'jianzi', t: 0, dur: 0.8, fx: r.frog.x, fy: r.groundY - 20 * RF.view.u, tx: r.frog.x + U.rr(Math.random, -30, 30), ty: 0, apex, lineY: L.ty, ok });
        } else if (m.kind === 'dart') {
          r.setPose('throw', 0.4);
          m.flights.push({ kind: 'flat', prop: 'dart', t: 0, dur: 0.45, fx: from.x, fy: from.y, tx: L.tx, ty: ok ? L.ty + U.rr(Math.random, -8, 8) : L.ty + U.clamp(diff, -40, 40) * RF.view.u * 1.4, ok, stickA: U.rr(Math.random, -0.2, 0.2) });
        } else if (m.kind === 'plane') {
          r.setPose('throw', 0.45);
          m.flights.push({ kind: 'flat', prop: 'plane', t: 0, dur: 0.7, fx: from.x, fy: from.y, tx: ok ? L.tx : L.tx + U.clamp(diff, -30, 30) * RF.view.u * 1.5, ty: ok ? L.ty : L.ty + 50 * u, ok });
        } else if (m.kind === 'star') {
          r.setPose('throw', 0.5);
          const apex = r.groundY - (power / 100) * RF.view.h * 0.6;
          m.flights.push({ kind: 'up', prop: 'star', t: 0, dur: 0.9, fx: r.frog.x, fy: r.groundY - 30 * u, tx: r.frog.x + U.rr(Math.random, -40, 40), ty: 0, apex, lineY: L.ty, ok });
        }
        if (ok) r.setExpr(tier === 'P' ? 'stars' : 'happy', 0.5); else r.setExpr('sad', 0.7);
      } else {
        /* 空挥 */
        RF.sfx.whoosh();
        r.setPose(m.kind === 'goal' || m.kind === 'jianzi' ? 'kick' : 'throw', 0.35);
      }
    },
    miss(r, note) { r.setExpr('tense', 0.6); },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, gy = r.groundY;
      const n = r.nextNote();
      ctx.save();
      if (RF.scenes && RF.scenes['pow_' + m.kind]) {
        RF.scenes['pow_' + m.kind](ctx, r, this.layout(r, n));
      } else if (m.kind === 'basket') {
        const L = this.layout(r, n);
        ctx.save(); ctx.translate(L.tx, L.ty);
        if (m.netWig > 0) ctx.translate(Math.sin(m.netWig * 30) * 4 * u * m.netWig, 0);
        RF.props.draw(ctx, 'hoop', u * 1.1); ctx.restore();
      } else if (m.kind === 'goal') {
        const cw = w * 0.16, ch = h * 0.17, gx = w * 0.82 - cw / 2, gyy = gy - ch;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * u;
        ctx.strokeRect(gx, gyy, cw, ch);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2 * u;
        for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(gx + cw * i / 5, gyy); ctx.lineTo(gx + cw * i / 5, gy); ctx.stroke(); }
        for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(gx, gyy + ch * i / 4); ctx.lineTo(gx + cw, gyy + ch * i / 4); ctx.stroke(); }
        /* 目标角提示 */
        if (n) {
          const c = n.aim % 4;
          const cx = gx + ((c % 2) + 0.5) * cw / 2, cy = gyy + (c < 2 ? 0.25 : 0.75) * ch;
          const pl = 0.6 + Math.sin(r.now() * 8) * 0.4;
          ctx.strokeStyle = 'rgba(255,211,77,' + pl + ')'; ctx.lineWidth = 3 * u;
          RF.util.circle(ctx, cx, cy, 14 * u); ctx.stroke();
        }
        /* 守门员 */
        const kp = m.keeper;
        const kx = gx + cw / 2 + (kp ? kp.dir * cw * 0.4 * Math.min(1, kp.t * 4) : 0);
        const ky = gy - 26 * u - (kp ? Math.sin(Math.min(1, kp.t * 3) * Math.PI) * 20 * u : 0);
        ctx.fillStyle = '#7E57C2';
        RF.util.ell(ctx, kx, ky, 14 * u, 20 * u); ctx.fill();
        ctx.fillStyle = '#5E35B1';
        RF.util.circle(ctx, kx, ky - 22 * u, 10 * u); ctx.fill();
        ctx.fillStyle = '#fff';
        RF.util.circle(ctx, kx - 3 * u, ky - 24 * u, 2.4 * u); ctx.fill();
        RF.util.circle(ctx, kx + 3 * u, ky - 24 * u, 2.4 * u); ctx.fill();
      } else if (m.kind === 'jianzi') {
        const L = this.layout(r, n);
        const ly = n ? L.ty : gy - h * 0.3;
        ctx.strokeStyle = 'rgba(239,83,80,' + (0.6 + m.lineFlash * 0.4) + ')';
        ctx.lineWidth = (2.5 + m.lineFlash * 3) * u;
        ctx.setLineDash([10 * u, 8 * u]);
        ctx.beginPath(); ctx.moveTo(w * 0.15, ly); ctx.lineTo(w * 0.85, ly); ctx.stroke();
        ctx.setLineDash([]);
        RF.props.draw(ctx, 'flag', u, 0); ctx.save(); ctx.translate(w * 0.85, ly - 5 * u); RF.props.draw(ctx, 'flag', u); ctx.restore();
        ctx.fillStyle = 'rgba(90,60,20,0.7)';
        ctx.font = '700 ' + 13 * u + 'px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('目标高度线', w * 0.15, ly - 6 * u);
      } else if (m.kind === 'dart') {
        const L = this.layout(r, n);
        ctx.save(); ctx.translate(L.tx, L.ty);
        const rings = [['#EF5350', 34], ['#fff', 26], ['#42A5F5', 18], ['#fff', 10], ['#EF5350', 4]];
        for (const [c, rr] of rings) { ctx.fillStyle = c; RF.util.circle(ctx, 0, 0, rr * u); ctx.fill(); }
        ctx.restore();
        for (const s of m.sticks) {
          ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.PI / 2 + s.a); RF.props.draw(ctx, 'dart', u * 0.9); ctx.restore();
        }
      }
      /* 飞行物 */
      for (const f of m.flights) {
        const k = f.t / f.dur;
        let x, y, rot = 0;
        if (f.kind === 'up') {
          x = U.lerp(f.fx, f.tx, k);
          y = k < 0.5 ? U.lerp(f.fy, f.apex, U.easeOut(k * 2)) : U.lerp(f.apex, f.fy, U.easeIn((k - 0.5) * 2));
          rot = k * 8;
        } else if (f.kind === 'flat') {
          x = U.lerp(f.fx, f.tx, k); y = U.lerp(f.fy, f.ty, k) - Math.sin(k * Math.PI) * 20 * u;
          rot = Math.PI / 2;
        } else {
          x = U.lerp(f.fx, f.tx, k); y = U.lerp(f.fy, f.ty, k) - Math.sin(k * Math.PI) * (Math.abs(f.tx - f.fx) * 0.3 + 60 * u);
          rot = k * 12;
        }
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        RF.props.draw(ctx, f.prop, u);
        ctx.restore();
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ 原型 2：SwingHit 挥拍击球（来球踩拍点击） ============ */
  M.swing = {
    init(r) {
      const k = r.cfg.params.kind;
      r.m = {
        kind: k, returns: [], drops: [], flash: 0, marks: [],
        ballProp: r.cfg.params.ballProp || { badminton: 'shuttle', tt: 'ttball', vb: 'volleyball', tennis: 'tennisball', frisbee: 'frisbee' }[k],
        ballScale: r.cfg.params.ballScale || 1
      };
      r.frog.prop = r.cfg.params.prop || null;
      r.m.incoming = r.chart.notes.map(n => this._spawn(r, n));
    },
    _spawn(r, n) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u;
      const hp = this.hitPoint(r);
      let sx, sy;
      const k = r.m ? r.m.kind : r.cfg.params.kind;
      if (k === 'frisbee') {
        const fromLeft = n.dir === 0 ? true : n.dir === 2 ? false : (n.i % 2 === 0);
        sy = h * U.rr(U.mulberry32(n.i + 5), 0.25, 0.5);
        sx = fromLeft ? -50 * u : w + 50 * u;
        return { n, sx, sy, hx: w / 2, hy: sy, fromLeft, A: 1.0 };
      }
      if (n.dir === 0) { sx = -40 * u; sy = hp.y - h * 0.18; }
      else if (n.dir === 2) { sx = w + 40 * u; sy = hp.y - h * 0.22; }
      else { sx = hp.x + U.rr(U.mulberry32(n.i + 3), -w * 0.2, w * 0.2); sy = -40 * u; }
      return { n, sx, sy, hx: hp.x, hy: hp.y, A: 0.9 };
    },
    hitPoint(r) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u;
      const k = r.m.kind;
      if (k === 'vb') return { x: r.frog.x, y: r.frog.y - 70 * u };
      if (k === 'frisbee') return { x: w / 2, y: h * 0.4 };
      return { x: r.frog.x + 60 * u * r.frog.face, y: r.frog.y - 40 * u };
    },
    update(r, dt) {
      const m = r.m, now = r.now();
      m.flash = Math.max(0, m.flash - dt * 6);
      for (let i = m.returns.length - 1; i >= 0; i--) {
        const b = m.returns[i]; b.t += dt;
        if (b.t > b.dur) m.returns.splice(i, 1);
      }
      for (let i = m.drops.length - 1; i >= 0; i--) {
        const b = m.drops[i]; b.t += dt; b.vy += 900 * dt; b.y += b.vy * dt; b.x += b.vx * dt;
        if (b.t > 1.2) m.drops.splice(i, 1);
      }
      for (let i = m.marks.length - 1; i >= 0; i--) { m.marks[i].t += dt; if (m.marks[i].t > 0.8) m.marks.splice(i, 1); }
      const hp = this.hitPoint(r);
      r.cueX = hp.x; r.cueY = hp.y;
    },
    down(r, e) {
      const m = r.m, now = r.now();
      const note = r.pending(r.winG);
      if (!note) { RF.sfx.whoosh(); r.setPose(m.kind === 'vb' ? 'catch' : 'swing', 0.3); return; }
      const tier = J.timeTier(now - note.t, r.winS);
      r.submit(note, tier, { x: r.frog.x, y: r.frog.y - 95 * r.frog.s });
      const hp = this.hitPoint(r);
      if (m.kind === 'vb') r.setPose(note.dir === 1 ? 'jump' : 'catch', 0.4);
      else r.setPose('swing', 0.35);
      r.setExpr(tier === 'M' ? 'tense' : tier === 'P' ? 'stars' : 'happy', 0.5);
      if (tier !== 'M') {
        RF.sfx.whoosh(); RF.sfx.hit();
        m.flash = 1;
        const sp = tier === 'P' ? 0.35 : 0.5;
        if (m.kind === 'frisbee') {
          RF.fx.confetti(hp.x, hp.y, 12);
        } else {
          m.returns.push({ prop: m.ballProp, sc: m.ballScale, t: 0, dur: sp + 0.3, x: hp.x, y: hp.y, dx: (note.ret - 1) * RF.view.w * 0.5, dy: -RF.view.h * 0.5, arc: tier === 'P' ? 60 : 140 });
          if (m.kind === 'tennis') m.marks.push({ t: 0, x: RF.view.w * 0.25 + (note.ret) * RF.view.w * 0.12, y: r.groundY - 30 * RF.view.u, ok: true });
        }
      } else {
        if (m.kind === 'tennis') m.marks.push({ t: 0, x: RF.view.w * 0.1, y: r.groundY - 60 * RF.view.u, ok: false });
      }
    },
    up() { },
    miss(r, note) {
      const m = r.m;
      const inc = m.incoming.find(o => o.n === note);
      if (inc) m.drops.push({ prop: m.ballProp || 'frisbee', sc: m.ballScale, t: 0, x: inc.hx, y: inc.hy, vx: U.rr(Math.random, -60, 60), vy: 80 });
      r.setExpr('sad', 0.6);
      if (r.m.kind === 'tt' || r.m.kind === 'badminton') RF.sfx.bounce();
    },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, gy = r.groundY, now = r.now();
      ctx.save();
      /* 记分牌 */
      ctx.fillStyle = 'rgba(38,50,56,0.85)';
      U.roundRect(ctx, w * 0.03, h * 0.12, 96 * u, 42 * u, 6 * u); ctx.fill();
      ctx.fillStyle = '#FFD34D'; ctx.font = '800 ' + 14 * u + 'px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(r.scoreState.combo + ' COMBO', w * 0.03 + 48 * u, h * 0.12 + 14 * u);
      ctx.fillStyle = '#fff'; ctx.font = '700 ' + 11 * u + 'px system-ui,sans-serif';
      ctx.fillText('P' + r.scoreState.p + ' G' + r.scoreState.g + ' M' + r.scoreState.m, w * 0.03 + 48 * u, h * 0.12 + 30 * u);
      /* 场地 */
      if (m.kind === 'badminton' || m.kind === 'tennis') {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3 * u;
        ctx.beginPath(); ctx.moveTo(w * 0.06, gy); ctx.lineTo(w * 0.94, gy); ctx.stroke();
        ctx.strokeStyle = '#ECEFF1'; ctx.lineWidth = 3 * u;
        ctx.beginPath(); ctx.moveTo(w * 0.45, gy); ctx.lineTo(w * 0.45, gy - h * 0.22); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5 * u;
        for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(w * 0.45 - 8 * u, gy - h * 0.22 + i * h * 0.036); ctx.lineTo(w * 0.45 + 8 * u, gy - h * 0.22 + i * h * 0.036); ctx.stroke(); }
      } else if (m.kind === 'tt') {
        ctx.fillStyle = '#1565C0';
        RF.util.roundRect(ctx, w * 0.18, gy - h * 0.16, w * 0.64, h * 0.035, 4 * u); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * u;
        ctx.beginPath(); ctx.moveTo(w * 0.5, gy - h * 0.16); ctx.lineTo(w * 0.5, gy - h * 0.21); ctx.stroke();
        ctx.fillStyle = '#0D47A1';
        ctx.fillRect(w * 0.24, gy - h * 0.13, 6 * u, h * 0.13);
        ctx.fillRect(w * 0.74, gy - h * 0.13, 6 * u, h * 0.13);
      } else if (m.kind === 'vb') {
        ctx.fillStyle = 'rgba(255,224,130,0.8)';
        ctx.fillRect(0, gy, w, h - gy);
      }
      /* 落点标记（网球） */
      for (const mk of m.marks) {
        ctx.globalAlpha = 1 - mk.t / 0.8;
        ctx.strokeStyle = mk.ok ? '#81C784' : '#EF5350'; ctx.lineWidth = 3 * u;
        RF.util.circle(ctx, mk.x, mk.y, 12 * u + mk.t * 20 * u); ctx.stroke();
        if (!mk.ok) {
          ctx.fillStyle = '#EF5350'; ctx.font = '900 ' + 16 * u + 'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.fillText('OUT!', mk.x, mk.y - 20 * u);
        }
        ctx.globalAlpha = 1;
      }
      /* 来球 */
      for (const o of m.incoming) {
        const n = o.n;
        if (n.judged) continue;
        const dtIn = n.t - now;
        if (dtIn > o.A || dtIn < -0.25) continue;
        const k = 1 - Math.max(0, dtIn) / o.A;
        const x = U.lerp(o.sx, o.hx, k), y = U.lerp(o.sy, o.hy, k) - (m.kind === 'frisbee' ? 0 : Math.sin(k * Math.PI) * 40 * u);
        ctx.save(); ctx.translate(x, y); ctx.rotate(k * 6);
        RF.props.draw(ctx, m.ballProp, u * (m.ballScale || 1));
        ctx.restore();
      }
      /* 回球 */
      for (const b of m.returns) {
        const k = b.t / b.dur;
        const x = b.x + b.dx * k, y = b.y + b.dy * k + Math.sin(k * Math.PI) * b.arc * u;
        ctx.save(); ctx.translate(x, y); ctx.rotate(k * 10);
        RF.props.draw(ctx, b.prop, u * (b.sc || 1));
        ctx.restore();
      }
      /* 掉落 */
      for (const b of m.drops) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 5);
        RF.props.draw(ctx, b.prop, u * (b.sc || 1));
        ctx.restore();
      }
      /* 击球闪光 */
      if (m.flash > 0) {
        const hp = this.hitPoint(r);
        ctx.strokeStyle = 'rgba(255,255,255,' + m.flash + ')';
        ctx.lineWidth = 4 * u * m.flash;
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * U.TAU;
          ctx.beginPath();
          ctx.moveTo(hp.x + Math.cos(a) * 10 * u, hp.y + Math.sin(a) * 10 * u);
          ctx.lineTo(hp.x + Math.cos(a) * (24 + (1 - m.flash) * 20) * u, hp.y + Math.sin(a) * (24 + (1 - m.flash) * 20) * u);
          ctx.stroke();
        }
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ 原型 3：Race 赛车剧本（点击左右踩拍过弯） ============ */
  M.race = {
    init(r) {
      r.m = { carX: RF.view.w / 2, tilt: 0, speed: 1, scroll: 0, wobble: 0, boost: 0, finished: false, run: r.cfg.params.kind === 'run' };
      r.frog.prop = r.cfg.params.prop || (r.m.run ? null : 'wheel');
    },
    roadCenter(r, t) {
      const w = RF.view.w;
      let c = w / 2;
      for (const n of r.chart.notes) {
        const k = (t - n.t) / 1.2;
        if (k > 0) c += (n.dir === 'L' ? -1 : 1) * w * 0.16 * U.easeInOut(U.clamp(k, 0, 1));
      }
      return U.clamp(c, w * 0.28, w * 0.72);
    },
    update(r, dt) {
      const m = r.m, now = r.now(), w = RF.view.w;
      const rc = this.roadCenter(r, now);
      m.boost = Math.max(0, m.boost - dt * 1.5);
      m.wobble = Math.max(0, m.wobble - dt * 2);
      m.speed = U.lerp(m.speed, 1 + m.boost * 0.5 - m.wobble * 0.4, dt * 3);
      m.scroll += dt * 420 * m.speed;
      const off = Math.abs(m.carX - rc);
      m.carX = U.lerp(m.carX, rc, dt * (off > w * 0.12 ? 1.2 : 4));
      m.tilt = U.lerp(m.tilt, U.clamp((rc - m.carX) / (w * 0.1), -1, 1) * 0.3, dt * 8);
      if (off > w * 0.14 && Math.random() < 0.3) RF.fx.burst(m.carX, r.groundY - 10, '#B0BEC5', 2, { speed: 60, grav: 200 });
      if (m.run) { r.frog.pose = 'run'; r.frog.poseDur = 0; }
      r.cueX = m.carX; r.cueY = r.groundY - 105 * RF.view.u;
      if (now > r.chart.duration - 0.6 && !m.finished) { m.finished = true; RF.sfx.whistle(); RF.fx.confetti(w / 2, RF.view.h * 0.4, 24); }
    },
    down(r, e) {
      const m = r.m, now = r.now(), w = RF.view.w;
      /* 键盘关只用键盘/屏幕方向键：无方向事件（如半屏点击）不参与判定 */
      if (!e.dir) return;
      const side = e.dir;
      /* 只接受本关谱面真实使用的方向；未使用方向的按键（如纯左右关按 W/S）不判定 */
      if (!m.dirs) { m.dirs = new Set(); for (const nn of r.chart.notes) m.dirs.add(nn.dir); }
      if (!m.dirs.has(side)) return;
      /* 先按"方向匹配"找音豆：按 L 只可能判给 L 音豆，不会被时间更近的其他方向音豆抢走 */
      let note = null, bd = 1e9;
      for (const nn of r.chart.notes) {
        if (nn.judged || nn.dir !== side) continue;
        const d = Math.abs(nn.t - now);
        if (d <= r.winG && d < bd) { bd = d; note = nn; }
      }
      if (!note) { if (side === 'L' || side === 'R') m.tilt += (side === 'L' ? -0.12 : 0.12); return; }
      const correct = note.dir === side;
      const tier = J.timeTier(now - note.t, r.winS);
      const final = correct ? tier : 'M';
      r.submit(note, final, { x: m.carX, y: r.groundY - 120 * RF.view.u });
      if (correct && final !== 'M') {
        if (r.cfg.params.elbow) RF.fx.float('肘开!', m.carX, r.groundY - 150 * RF.view.u, '#FF7043', 44 * RF.view.u);
        if (side === 'U') r.setPose('jump', 0.5);
        else if (side === 'D') r.setPose('hide', 0.4);
        m.boost = 1; m.tilt = (side === 'L' ? -0.35 : side === 'R' ? 0.35 : 0);
        RF.sfx.drift();
        RF.fx.burst(m.carX + (side === 'L' ? 30 : side === 'R' ? -30 : 0), r.groundY - 8 * RF.view.u, '#FFE082', 8, { speed: 140, grav: 300 });
        r.setExpr(final === 'P' ? 'stars' : 'happy', 0.4);
      } else {
        m.wobble = 1;
        r.setExpr('tense', 0.6);
      }
    },
    up() { },
    miss(r, note) { r.m.wobble = 1; r.setExpr('tense', 0.6); },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      const gy = r.groundY;
      ctx.save();
      if (RF.scenes && RF.scenes['race_' + r.cfg.params.kind]) RF.scenes['race_' + r.cfg.params.kind](ctx, r);
      /* 赛道（俯视竖卷） */
      const rw = w * 0.42;
      const rc = this.roadCenter(r, now);
      ctx.fillStyle = m.run ? '#9E9E9E' : '#607D8B';
      ctx.beginPath();
      ctx.moveTo(rc - rw / 2, h); ctx.lineTo(rc + rw / 2, h);
      const top = h * 0.32, rct = this.roadCenter(r, now + 2.2);
      ctx.lineTo(rct + rw * 0.18, top); ctx.lineTo(rct - rw * 0.18, top);
      ctx.closePath(); ctx.fill();
      /* 边线 */
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * u;
      ctx.beginPath(); ctx.moveTo(rc - rw / 2, h); ctx.lineTo(rct - rw * 0.18, top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rc + rw / 2, h); ctx.lineTo(rct + rw * 0.18, top); ctx.stroke();
      /* 中线滚动 */
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 5 * u;
      ctx.setLineDash([26 * u, 30 * u]);
      ctx.lineDashOffset = -m.scroll % (56 * u);
      ctx.beginPath(); ctx.moveTo(rc, h); ctx.lineTo(rct, top); ctx.stroke();
      ctx.setLineDash([]);
      /* 终点线 */
      const dtF = r.chart.duration - 0.6 - now;
      if (dtF < 2.4 && dtF > -0.5) {
        const k = 1 - U.clamp(dtF, 0, 2.4) / 2.4;
        const y = U.lerp(top, h * 0.8, k);
        const cx = this.roadCenter(r, now + Math.max(0, dtF) * 1.1);
        const halfW = U.lerp(rw * 0.18, rw / 2, k);
        for (let i = 0; i < 10; i++) {
          ctx.fillStyle = i % 2 ? '#fff' : '#212121';
          ctx.fillRect(cx - halfW + (halfW * 2) * i / 10, y, halfW * 2 / 10, 10 * u);
          ctx.fillStyle = i % 2 ? '#212121' : '#fff';
          ctx.fillRect(cx - halfW + (halfW * 2) * i / 10, y + 10 * u, halfW * 2 / 10, 10 * u);
        }
      }
      /* 弯道指示牌（提前 2 秒逼近） */
      for (const n of r.chart.notes) {
        const dtN = n.t - now;
        if (dtN > 2.2 || dtN < -0.3 || n.judged) continue;
        const k = 1 - U.clamp(dtN, 0, 2.2) / 2.2;
        const y = U.lerp(top + 10 * u, h * 0.62, k);
        const cx = this.roadCenter(r, n.t);
        const sc = U.lerp(0.5, 1.3, k);
        ctx.save(); ctx.translate(cx, y); ctx.scale(sc, sc);
        ctx.fillStyle = 'rgba(255,211,77,0.95)';
        RF.util.roundRect(ctx, -22 * u, -16 * u, 44 * u, 32 * u, 8 * u); ctx.fill();
        ctx.save();
        ctx.rotate({ U: -Math.PI / 2, D: Math.PI / 2, L: Math.PI, R: 0 }[n.dir] || 0);
        ctx.fillStyle = '#8a5a2b';
        ctx.beginPath(); ctx.moveTo(11 * u, 0); ctx.lineTo(-8 * u, -9 * u); ctx.lineTo(-8 * u, 9 * u); ctx.closePath(); ctx.fill();
        ctx.restore();
        /* 障碍预示：U=路面栏（跳），D=头顶杆（蹲） */
        if (n.dir === 'U') { ctx.fillStyle = 'rgba(239,83,80,0.9)'; ctx.fillRect(-rw * 0.16, 20 * u, rw * 0.32, 7 * u); }
        if (n.dir === 'D') { ctx.fillStyle = 'rgba(66,165,245,0.9)'; ctx.fillRect(-rw * 0.16, -36 * u, rw * 0.32, 7 * u); }
        ctx.restore();
      }
      /* 公交（赶公交关） */
      if (m.run) {
        const bx = this.roadCenter(r, now + 1.6), by = top + 50 * u;
        ctx.fillStyle = '#66BB6A';
        U.roundRect(ctx, bx - 42 * u, by - 30 * u, 84 * u, 48 * u, 8 * u); ctx.fill();
        ctx.fillStyle = '#B3E5FC';
        for (let i = 0; i < 3; i++) { U.roundRect(ctx, bx - 34 * u + i * 23 * u, by - 24 * u, 17 * u, 13 * u, 3 * u); ctx.fill(); }
        ctx.fillStyle = '#212121';
        U.circle(ctx, bx - 26 * u, by + 18 * u, 7 * u); ctx.fill();
        U.circle(ctx, bx + 26 * u, by + 18 * u, 7 * u); ctx.fill();
        const left = Math.max(0, Math.round((r.chart.count - r.scoreState.p - r.scoreState.g) * 3));
        ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = '800 ' + 13 * u + 'px system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('距公交 ' + left + ' 米', bx, by - 42 * u);
      }
      /* 卡丁车 + 奶蛙 */
      if (!m.run) {
      ctx.save();
      ctx.translate(m.carX, gy - 6 * u);
      ctx.rotate(m.tilt + Math.sin(now * 40) * m.wobble * 0.06);
      const ks = u * 1.05;
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; RF.util.ell(ctx, 0, 26 * ks, 46 * ks, 10 * ks); ctx.fill();
      ctx.fillStyle = '#212121';
      RF.util.roundRect(ctx, -40 * ks, 6 * ks, 18 * ks, 22 * ks, 5 * ks); ctx.fill();
      RF.util.roundRect(ctx, 22 * ks, 6 * ks, 18 * ks, 22 * ks, 5 * ks); ctx.fill();
      RF.util.roundRect(ctx, -34 * ks, -8 * ks, 14 * ks, 18 * ks, 4 * ks); ctx.fill();
      RF.util.roundRect(ctx, 20 * ks, -8 * ks, 14 * ks, 18 * ks, 4 * ks); ctx.fill();
      ctx.fillStyle = '#EF5350';
      RF.util.roundRect(ctx, -26 * ks, -2 * ks, 52 * ks, 24 * ks, 8 * ks); ctx.fill();
      ctx.fillStyle = '#FFCDD2';
      RF.util.roundRect(ctx, -14 * ks, 2 * ks, 28 * ks, 10 * ks, 4 * ks); ctx.fill();
      ctx.restore();
      }
      if (m.run) { r.frog.x = m.carX; r.frog.y = gy - 50 * u; r.frog.s = u; M.drawFrog(r, ctx); }
      else { r.frog.x = m.carX; r.frog.y = gy - 34 * u; r.frog.s = u * 0.85; M.drawFrog(r, ctx, { noShadow: true }); }
      ctx.restore();
    }
  };
})();

</script>
<script>
/* 节奏小奶蛙 - 第二阶段机制原型：target 移动目标 / beattap 踩拍家务 / fall 三轨接物 / choice 四桶选择
   接口同 mechanics.js：init/update/draw/down/up/miss */
(function () {
  const U = RF.util, J = RF.judge;
  const M = RF.mech;

  /* ============ target：踩拍点击目标（苍蝇/裂口/衣架/菜篮/花盆） ============ */
  M.target = {
    init(r) {
      r.m = { kind: r.cfg.params.kind, done: {}, doneAt: {}, splats: [], hung: [] };
      r.frog.prop = r.cfg.params.prop || null;
    },
    /* 点击放大反馈 */
    pop(r, n) {
      const dt = r.now() - (r.m.doneAt[n.i] == null ? -9 : r.m.doneAt[n.i]);
      if (dt < 0 || dt > 0.35) return 1;
      return 1 + 0.35 * RF.util.easeOutBack(1 - dt / 0.35) * 0.9;
    },
    /* 办公桌场景（写实：木纹桌+显示器+键盘鼠标+马克杯+文件+笔筒） */
    _desk(ctx, w, h, u, noMonitor) {
      const dg = ctx.createLinearGradient(0, h * 0.6, 0, h * 0.66);
      dg.addColorStop(0, '#A1887F'); dg.addColorStop(1, '#8D6E63');
      ctx.fillStyle = dg;
      U.roundRect(ctx, w * 0.1, h * 0.6, w * 0.8, 16 * u, 6 * u); ctx.fill();
      ctx.fillStyle = '#6D4C41';
      U.roundRect(ctx, w * 0.12, h * 0.6 + 14 * u, w * 0.76, h * 0.05, 4 * u); ctx.fill();
      ctx.fillRect(w * 0.15, h * 0.65 + h * 0.05, 12 * u, h * 0.14);
      ctx.fillRect(w * 0.81, h * 0.65 + h * 0.05, 12 * u, h * 0.14);
      if (!noMonitor) {
        ctx.fillStyle = '#455A64';
        U.ell(ctx, w * 0.5, h * 0.6, 34 * u, 6 * u); ctx.fill();
        ctx.fillStyle = '#546E7A'; U.roundRect(ctx, w * 0.5 - 6 * u, h * 0.52, 12 * u, 26 * u, 3 * u); ctx.fill();
        const bz = ctx.createLinearGradient(w * 0.34, h * 0.28, w * 0.66, h * 0.52);
        bz.addColorStop(0, '#37474F'); bz.addColorStop(1, '#263238');
        ctx.fillStyle = bz; U.roundRect(ctx, w * 0.34, h * 0.28, w * 0.32, h * 0.24, 6 * u); ctx.fill();
        const sc = ctx.createLinearGradient(w * 0.35, h * 0.29, w * 0.65, h * 0.51);
        sc.addColorStop(0, '#4FC3F7'); sc.addColorStop(0.55, '#29B6F6'); sc.addColorStop(1, '#0288D1');
        ctx.fillStyle = sc; U.roundRect(ctx, w * 0.352, h * 0.292, w * 0.296, h * 0.208, 3 * u); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        U.roundRect(ctx, w * 0.37, h * 0.31, w * 0.16, h * 0.1, 3 * u); ctx.fill();
        ctx.fillStyle = '#EF5350'; U.roundRect(ctx, w * 0.37, h * 0.31, w * 0.16, h * 0.022, 2 * u); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (let i = 0; i < 3; i++) { U.roundRect(ctx, w * 0.55, h * (0.32 + i * 0.03), w * 0.08, h * 0.016, 2 * u); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.moveTo(w * 0.352, h * 0.292); ctx.lineTo(w * 0.45, h * 0.292); ctx.lineTo(w * 0.352, h * 0.42); ctx.closePath(); ctx.fill();
      }

        ctx.moveTo(s.x + 10 * u, s.y - 10 * u); ctx.lineTo(s.x - 10 * u, s.y + 10 * u); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ beattap：踩拍家务（洗碗/扫地） ============ */
  M.beattap = {
    init(r) {
      r.m = { kind: r.cfg.params.kind, clean: 0, left: r.chart.notes.length, anims: [] };
      r.frog.prop = r.cfg.params.prop || null;
    },
    update(r, dt) {
      const n = r.nextNote();
      if (n && r.m.kind === 'sweep') { r.cueX = n.px * RF.view.w; r.cueY = n.py * RF.view.h; }
      else { r.cueX = RF.view.w * 0.5; r.cueY = RF.view.h * 0.52; }
      for (let i = r.m.anims.length - 1; i >= 0; i--) { r.m.anims[i].t += dt; if (r.m.anims[i].t > 0.6) r.m.anims.splice(i, 1); }
    },
    down(r, e) {
      const now = r.now(), u = RF.view.u, m = r.m;
      const note = r.pending(r.winG);
      if (!note) { r.setPose('swing', 0.25); RF.sfx.whoosh(); return; }
      const tier = J.timeTier(now - note.t, r.winS);
      const at = m.kind === 'sweep' ? { x: note.px * RF.view.w, y: note.py * RF.view.h } : { x: RF.view.w * 0.5, y: RF.view.h * 0.52 };
      r.submit(note, tier, { x: at.x, y: at.y - 40 * u });
      r.setPose('swing', 0.3);
      if (tier !== 'M') {
        m.clean++; m.left--;
        m.anims.push({ x: at.x, y: at.y, t: 0, ok: true });
        if (m.kind === 'tri') RF.sfx.ting();
        else if (m.kind === 'dish' || m.kind === 'sweep') RF.sfx.swish();
        else RF.sfx.pop();
        RF.fx.burst(at.x, at.y, m.kind === 'dish' ? '#81D4FA' : '#FFE082', 8, { speed: 150 });
        r.setExpr(tier === 'P' ? 'smile' : 'happy', 0.4);
      } else {
        m.anims.push({ x: at.x, y: at.y, t: 0, ok: false });
        if (m.kind === 'dish') { RF.sfx.shatter(); RF.fx.burst(at.x, at.y, '#ECEFF1', 14, { speed: 240, grav: 700 }); }
        else { r.setPose('slip', 0.7); r.setExpr('dizzy', 0.9); }
      }
    },
    up() { },
    miss(r, n) {
      const m = r.m;
      m.left--;
      if (m.kind === 'dish') { RF.sfx.shatter(); RF.fx.burst(RF.view.w * 0.5, RF.view.h * 0.52, '#ECEFF1', 14, { speed: 240, grav: 700 }); }
      else if (m.kind === 'sweep') { r.setPose('slip', 0.7); r.setExpr('dizzy', 0.9); }
      else if (m.kind === 'tri') { RF.sfx.bounce(); r.setExpr('tense', 0.6); }
      else { r.setPose('hide', 0.5); r.setExpr('tense', 0.8); }
    },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      ctx.save();
      if (RF.scenes && RF.scenes['tap_' + m.kind]) {
        RF.scenes['tap_' + m.kind](ctx, r);
      } else if (m.kind === 'dish') {
        /* 水槽 */
        ctx.fillStyle = '#B0BEC5';
        U.roundRect(ctx, w * 0.5 - 70 * u, h * 0.52 - 30 * u, 140 * u, 70 * u, 12 * u); ctx.fill();
        ctx.fillStyle = '#90A4AE';
        U.roundRect(ctx, w * 0.5 - 58 * u, h * 0.52 - 20 * u, 116 * u, 50 * u, 10 * u); ctx.fill();
        ctx.fillStyle = 'rgba(129,212,250,0.5)';
        U.roundRect(ctx, w * 0.5 - 58 * u, h * 0.52 - 6 * u, 116 * u, 36 * u, 8 * u); ctx.fill();
        /* 脏碗堆 / 干净堆 */
        for (let i = 0; i < Math.min(6, m.left); i++) { ctx.fillStyle = '#FFF9C4'; U.ell(ctx, w * 0.24, h * 0.56 - i * 7 * u, 26 * u, 9 * u); ctx.fill(); ctx.strokeStyle = '#E0C060'; ctx.lineWidth = 1.4 * u; ctx.stroke(); }
        for (let i = 0; i < Math.min(6, m.clean); i++) { ctx.fillStyle = '#FFFDE7'; U.ell(ctx, w * 0.76, h * 0.56 - i * 7 * u, 26 * u, 9 * u); ctx.fill(); ctx.strokeStyle = '#81C784'; ctx.lineWidth = 1.4 * u; ctx.stroke(); }
        ctx.textAlign = 'center'; ctx.font = '700 ' + 12 * u + 'px system-ui,sans-serif'; ctx.fillStyle = 'rgba(90,60,20,0.7)';
        ctx.fillText('待洗 ' + m.left, w * 0.24, h * 0.62);
        ctx.fillText('洗净 ' + m.clean, w * 0.76, h * 0.62);
      } else if (m.kind === 'sweep') {
        for (const n of r.chart.notes) {
          if (n.judged) continue;
          if (n.t - now > 2.4) continue;
          ctx.fillStyle = 'rgba(121,85,72,0.55)';
          U.ell(ctx, n.px * w, n.py * h, 26 * u, 14 * u, 0.3); ctx.fill();
          U.ell(ctx, n.px * w + 14 * u, n.py * h + 6 * u, 12 * u, 7 * u, -0.4); ctx.fill();
        }
      } else if (m.kind === 'tri') {
        /* 三角铁 */
        const cx = w / 2, cy = h * 0.48;
        ctx.strokeStyle = '#B0BEC5'; ctx.lineWidth = 6 * u;
        ctx.beginPath(); ctx.moveTo(cx, cy - 34 * u); ctx.lineTo(cx + 34 * u, cy + 24 * u); ctx.lineTo(cx - 34 * u, cy + 24 * u); ctx.closePath(); ctx.stroke();
        ctx.strokeStyle = '#78909C'; ctx.lineWidth = 2 * u;
        ctx.beginPath(); ctx.moveTo(cx, cy - 46 * u); ctx.lineTo(cx, cy - 34 * u); ctx.stroke();
        const hit = m.anims.find(a => a.ok && a.t < 0.3);
        if (hit) {
          ctx.strokeStyle = 'rgba(255,255,255,' + (1 - hit.t / 0.3).toFixed(3) + ')'; ctx.lineWidth = 3 * u;
          for (let i = 0; i < 6; i++) {
            const a = i / 6 * U.TAU + hit.t * 6;
            ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 40 * u, cy + Math.sin(a) * 40 * u);
            ctx.lineTo(cx + Math.cos(a) * 56 * u, cy + Math.sin(a) * 56 * u); ctx.stroke();
          }
        }
      } else if (m.kind === 'slack') {
        /* 工位显示器 */
        const cx = w / 2, cy = h * 0.46;
        ctx.fillStyle = '#37474F'; U.roundRect(ctx, cx - 70 * u, cy - 46 * u, 140 * u, 92 * u, 8 * u); ctx.fill();
        ctx.fillStyle = m.clean % 2 ? '#81C784' : '#4FC3F7';
        U.roundRect(ctx, cx - 62 * u, cy - 38 * u, 124 * u, 76 * u, 4 * u); ctx.fill();
        ctx.fillStyle = '#263238'; U.roundRect(ctx, cx - 10 * u, cy + 46 * u, 20 * u, 14 * u, 3 * u); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '700 ' + 12 * u + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(m.clean % 2 ? 'WORK.EXE' : 'GAME.EXE', cx, cy);
        /* 经理巡查 */
        const n2 = r.nextNote();
        if (n2 && n2.t - now < 1.2) {
          const mx = w * 0.1 + (1 - (n2.t - now) / 1.2) * w * 0.12;
          ctx.fillStyle = '#455A64';
          U.ell(ctx, mx, h * 0.52, 14 * u, 26 * u); ctx.fill();
          ctx.fillStyle = '#FFCC80'; U.circle(ctx, mx, h * 0.52 - 30 * u, 10 * u); ctx.fill();
          ctx.fillStyle = '#EF5350'; ctx.font = '800 ' + 12 * u + 'px system-ui,sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('经理', mx, h * 0.52 - 48 * u);
        }
      } else if (m.kind === 'boss') {
        /* 主管回头 */
        const n = r.nextNote();
        const turning = n && n.t - now < 1.0;
        const bx = w / 2, by = h * 0.3;
        ctx.fillStyle = '#546E7A';
        U.ell(ctx, bx, by + 16 * u, 26 * u, 30 * u); ctx.fill();
        ctx.fillStyle = '#FFCC80'; U.circle(ctx, bx, by - 18 * u, 16 * u); ctx.fill();
        ctx.fillStyle = '#37474F';
        if (turning) { U.circle(ctx, bx - 5 * u, by - 20 * u, 2.5 * u); ctx.fill(); U.circle(ctx, bx + 5 * u, by - 20 * u, 2.5 * u); ctx.fill(); }
        else { U.ell(ctx, bx, by - 18 * u, 14 * u, 10 * u); ctx.fill(); }
        ctx.fillStyle = turning ? '#EF5350' : 'rgba(255,255,255,0.6)';
        ctx.font = '800 ' + 13 * u + 'px system-ui,sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(turning ? '回头了!' : '工作中…', bx, by - 44 * u);
        ctx.fillStyle = '#78909C'; U.roundRect(ctx, w * 0.2, h * 0.56, w * 0.6, 12 * u, 4 * u); ctx.fill();
      }
      for (const a of m.anims) {
        ctx.globalAlpha = 1 - a.t / 0.6;
        ctx.strokeStyle = a.ok ? '#81C784' : '#EF5350'; ctx.lineWidth = 4 * u;
        U.circle(ctx, a.x, a.y, (16 + a.t * 90) * u); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ fall：三轨下落接物（接菜/接快递） ============ */
  M.fall = {
    init(r) {
      r.m = { kind: r.cfg.params.kind, laneX: [0.3, 0.5, 0.7], caught: 0, splats: [], flash: [-9, -9, -9] };
      r.frog.prop = r.cfg.params.prop || null;
    },
    laneOf(x) { const w = RF.view.w; return x < w * 0.4 ? 0 : x < w * 0.62 ? 1 : 2; },
    update(r, dt) {
      const n = r.nextNote();
      if (n) { r.cueX = r.m.laneX[n.lane] * RF.view.w; r.cueY = RF.view.h * 0.62; }
      for (let i = r.m.splats.length - 1; i >= 0; i--) { r.m.splats[i].t += dt; if (r.m.splats[i].t > 0.8) r.m.splats.splice(i, 1); }
    },
    down(r, e) {
      const now = r.now(), u = RF.view.u, m = r.m;
      const lane = this.laneOf(e.x);
      const note = r.pending(r.winG);
      if (!note) { r.setPose('catch', 0.25); return; }
      const ok = lane === note.lane;
      const tier = ok ? J.timeTier(now - note.t, r.winS) : 'M';
      const cx = m.laneX[note.lane] * RF.view.w;
      r.submit(note, tier, { x: cx, y: RF.view.h * 0.56 });
      if (ok && tier !== 'M') {
        m.caught++; m.flash[note.lane] = now;
        r.setPose('catch', 0.35);
        r.setExpr(tier === 'P' ? 'stars' : 'happy', 0.4);
        RF.sfx.pop();
        RF.fx.burst(cx, RF.view.h * 0.6, '#FFD34D', 10, { speed: 170 });
      } else {
        r.setExpr('sad', 0.6);
      }
    },
    up() { },
    miss(r, n) {
      r.setExpr('sad', 0.6);
      r.m.splats.push({ lane: n.lane, t: 0 });
      RF.sfx.bounce();
    },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      const cy = h * 0.62;
      ctx.save();
      if (RF.scenes && RF.scenes['fall_' + m.kind]) {
        RF.scenes['fall_' + m.kind](ctx, r);
      } else if (m.kind === 'parcel') {
        /* 快递柜墙 */
        for (let ry = 0; ry < 3; ry++) for (let cx2 = 0; cx2 < 6; cx2++) {
          ctx.fillStyle = (ry + cx2) % 2 ? '#B0BEC5' : '#90A4AE';
          U.roundRect(ctx, w * 0.1 + cx2 * w * 0.135, h * 0.14 + ry * h * 0.1, w * 0.12, h * 0.085, 4 * u); ctx.fill();
          ctx.strokeStyle = '#607D8B'; ctx.lineWidth = 1.5 * u;
          U.roundRect(ctx, w * 0.1 + cx2 * w * 0.135, h * 0.14 + ry * h * 0.1, w * 0.12, h * 0.085, 4 * u); ctx.stroke();
        }
      } else {
        /* 打菜窗口 + 阿姨 + 接菜台 */
        ctx.fillStyle = '#8D6E63'; U.roundRect(ctx, w * 0.2, h * 0.1, w * 0.6, 14 * u, 4 * u); ctx.fill();
        ctx.fillStyle = '#F48FB1'; U.circle(ctx, w * 0.5, h * 0.075, 16 * u); ctx.fill();
        ctx.fillStyle = '#FFFDF4'; U.circle(ctx, w * 0.5, h * 0.068, 10 * u); ctx.fill();
        ctx.fillStyle = '#8D6E63'; U.roundRect(ctx, w * 0.14, h * 0.68, w * 0.72, 12 * u, 4 * u); ctx.fill();
      }
      /* 轨道 */
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(m.laneX[i] * w - w * 0.09, h * 0.2, w * 0.18, cy - h * 0.2 + 20 * u);
      }
      ctx.strokeStyle = 'rgba(139,69,19,0.5)'; ctx.lineWidth = 4 * u;
      ctx.beginPath(); ctx.moveTo(w * 0.16, cy); ctx.lineTo(w * 0.84, cy); ctx.stroke();
      /* 接物区闪光 */
      for (let i = 0; i < 3; i++) {
        const dtF = now - m.flash[i];
        if (dtF >= 0 && dtF < 0.3) {
          ctx.strokeStyle = 'rgba(255,211,77,' + (1 - dtF / 0.3) + ')'; ctx.lineWidth = 5 * u;
          U.circle(ctx, m.laneX[i] * w, cy, (24 + dtF * 120) * u); ctx.stroke();
        }
      }
      /* 下落物 */
      for (const n of r.chart.notes) {
        if (n.judged) continue;
        const dtN = n.t - now;
        if (dtN > 1.15 || dtN < -0.35) continue;
        const k = 1 - Math.max(0, dtN) / 1.15;
        const y = dtN >= 0 ? U.lerp(-30 * u, cy, k) : cy + (-dtN) * 500 * u;
        ctx.save(); ctx.translate(m.laneX[n.lane] * w, y); ctx.rotate(Math.sin(now * 4 + n.i) * 0.2);
        if (RF.scenes && RF.scenes['item_' + m.kind]) RF.scenes['item_' + m.kind](ctx, r, n, u);
        else if (m.kind === 'parcel') RF.props.draw(ctx, 'parcel', u);
        else RF.props.draw(ctx, n.i % 2 ? 'carrot' : 'cabbage', u);
        ctx.restore();
      }
      /* 落地碎 */
      for (const s of m.splats) {
        ctx.globalAlpha = 1 - s.t / 0.8;
        ctx.fillStyle = m.kind === 'parcel' ? '#A1887F' : '#8BC34A';
        for (let i = 0; i < 5; i++) U.circle(ctx, m.laneX[s.lane] * w + (i - 2) * 10 * u, cy + 8 * u, 4 * u), ctx.fill();
        ctx.globalAlpha = 1;
      }
      /* 饭碗进度（接菜关） */
      if (m.kind === 'veg') {
        const bx = w - 60 * u, by = 70 * u;
        ctx.fillStyle = '#FFFDE7';
        ctx.beginPath(); ctx.arc(bx, by, 24 * u, 0, Math.PI); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#E0C060'; ctx.lineWidth = 2 * u; ctx.stroke();
        const fill = r.chart.count ? m.caught / r.chart.count : 0;
        ctx.fillStyle = '#FFF9C4';
        ctx.beginPath(); ctx.arc(bx, by, 24 * u * fill, Math.PI, 0); ctx.closePath(); ctx.fill();
        ctx.textAlign = 'center'; ctx.font = '700 ' + 11 * u + 'px system-ui,sans-serif'; ctx.fillStyle = 'rgba(90,60,20,0.7)';
        ctx.fillText('饭碗', bx, by + 38 * u);
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ tri：开会三键选择（电话/闹钟/消息） ============ */
  M.tri = {
    SCEN: [['电话铃', '📞', 0], ['闹钟响', '⏰', 1], ['消息弹窗', '💬', 2]],
    BTNS: [['接电话', '#66BB6A'], ['关闹钟', '#42A5F5'], ['稍后读', '#FFB300']],
    answer(n) { return n.item % 3; },
    init(r) {
      r.m = { fb: -1, ft: -9 }; r.frog.prop = null;
      const w = RF.view.w;
      r.frog.x = w * 0.155; r.frog.face = 1;   // 坐到会议桌左端，不挡任何按键
    },
    btnX(i) { return RF.view.w * (0.3 + 0.2 * i); },
    update(r, dt) { r.cueX = RF.view.w / 2; r.cueY = RF.view.h * 0.37; },
    down(r, e) {
      const now = r.now(), u = RF.view.u;
      const note = r.pending(r.winG);
      if (!note) return;
      let bi = 0, bd = 1e9;
      for (let i = 0; i < 3; i++) { const d = Math.abs(e.x - this.btnX(i)); if (d < bd) { bd = d; bi = i; } }
      const ok = bi === this.answer(note);
      const tier = ok ? J.timeTier(now - note.t, r.winS) : 'M';
      r.submit(note, tier, { x: this.btnX(bi), y: RF.view.h * 0.6 });
      r.m.fb = bi; r.m.ft = now;
      if (ok && tier !== 'M') {
        RF.sfx.pop(); RF.fx.confetti(this.btnX(bi), RF.view.h * 0.62, 8);
        r.setPose('cheer', 0.3); r.setExpr('happy', 0.4);
      } else {
        const sc = this.SCEN[note.item % 3];
        RF.ui.toast('💡 ' + sc[0] + ' 应点「' + this.BTNS[this.answer(note)][0] + '」', 1500);
        r.setExpr('sad', 0.6);
      }
    },
    up() { },
    miss(r, n) {
      const sc = this.SCEN[n.item % 3];
      RF.ui.toast('💡 ' + sc[0] + ' 应点「' + this.BTNS[this.answer(n)][0] + '」', 1500);
      r.setExpr('tense', 0.7);
    },
    draw(r, ctx) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      ctx.save();
      const n = r.chart.notes.find(nn => !nn.judged && nn.t - now < 2.6 && nn.t - now > -0.2);
      if (n) {
        const sc = this.SCEN[n.item % 3];
        ctx.fillStyle = 'rgba(255,253,244,0.95)';
        U.roundRect(ctx, w / 2 - 84 * u, h * 0.24, 168 * u, 70 * u, 14 * u); ctx.fill();
        ctx.strokeStyle = '#EF5350'; ctx.lineWidth = 3 * u;
        U.roundRect(ctx, w / 2 - 84 * u, h * 0.24, 168 * u, 70 * u, 14 * u); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = (26 * u) + 'px system-ui,sans-serif';
        ctx.fillText(sc[1], w / 2 - 40 * u, h * 0.24 + 35 * u);
        ctx.font = '900 ' + 18 * u + 'px system-ui,sans-serif'; ctx.fillStyle = '#6b4a12';
        ctx.fillText(sc[0] + '！', w / 2 + 18 * u, h * 0.24 + 35 * u);
      }
      /* 会议桌 */
      ctx.fillStyle = '#6D4C41';
      U.ell(ctx, w / 2, h * 0.68, w * 0.36, h * 0.1); ctx.fill();
      ctx.fillStyle = '#8D6E63';
      U.ell(ctx, w / 2, h * 0.66, w * 0.36, h * 0.1); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const b = this.BTNS[i], x = this.btnX(i), y = h * 0.64;
        const fl = now - r.m.ft < 0.3 && r.m.fb === i;
        ctx.fillStyle = b[1];
        U.roundRect(ctx, x - 46 * u, y - 27 * u, 92 * u, 54 * u, 12 * u); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '800 ' + 15 * u + 'px system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b[0], x, y);
        if (fl) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4 * u; U.roundRect(ctx, x - 52 * u, y - 33 * u, 104 * u, 66 * u, 14 * u); ctx.stroke(); }
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };

  /* ============ choice：垃圾分类四桶选择 ============ */
  M.choice = {
    ITEMS: [['香蕉皮', '🍌', 0], ['塑料瓶', '🧴', 1], ['废旧电池', '🔋', 2], ['烟头', '🚬', 3], ['苹果核', '🍎', 0], ['旧报纸', '📰', 1], ['过期药品', '💊', 2], ['碎瓷碗', '🥣', 3]],
    BINS: [['厨余垃圾', '#66BB6A', '🥬'], ['可回收物', '#42A5F5', '♻'], ['有害垃圾', '#EF5350', '☠'], ['其他垃圾', '#9E9E9E', '🗑']],
    answer(n) { return this.ITEMS[n.item % 8][2]; },
    init(r) { r.m = { flashBin: -1, flashT: -9 }; r.frog.prop = null; },
    binX(i) { return RF.view.w * (0.2 + 0.2 * i); },
    update(r, dt) { r.cueX = RF.view.w / 2; r.cueY = RF.view.h * 0.3; },
    down(r, e) {
      const now = r.now(), u = RF.view.u;
      const note = r.pending(r.winG);
      if (!note) return;
      const bi = U.clamp(Math.floor(e.x / (RF.view.w / 4)), 0, 3);
      const ans = this.answer(note);
      const ok = bi === ans;
      const tier = ok ? J.timeTier(now - note.t, r.winS) : 'M';
      r.submit(note, tier, { x: this.binX(ans), y: RF.view.h * 0.56 });
      r.m.flashBin = bi; r.m.flashT = now;
      if (ok && tier !== 'M') {
        RF.sfx.pop();
        RF.fx.confetti(this.binX(bi), RF.view.h * 0.6, 10);
        r.setPose('cheer', 0.35); r.setExpr('happy', 0.4);
      } else {
        const it = this.ITEMS[note.item % 8];
        RF.ui.toast('💡 ' + it[0] + ' 属于「' + this.BINS[ans][0] + '」', 1600);
        r.setExpr('sad', 0.6);
      }
    },
    up() { },
    miss(r, n) {
      const it = this.ITEMS[n.item % 8];
      RF.ui.toast('💡 ' + it[0] + ' 属于「' + this.BINS[this.answer(n)][0] + '」', 1600);
      r.setExpr('tense', 0.6);
    },
    draw(r, ctx) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      ctx.save();
      const n = r.chart.notes.find(nn => !nn.judged && nn.t - now < 2.6 && nn.t - now > -0.2);
      /* 背景对照表：物品 → 垃圾桶（当前物品金框高亮） */
      const fs = Math.max(10, 9.5 * u);
      ctx.fillStyle = 'rgba(255,253,244,0.6)';
      U.roundRect(ctx, w * 0.03, h * 0.075, w * 0.94, h * 0.155, 10 * u); ctx.fill();
      ctx.strokeStyle = 'rgba(139,110,99,0.5)'; ctx.lineWidth = 2 * u;
      U.roundRect(ctx, w * 0.03, h * 0.075, w * 0.94, h * 0.155, 10 * u); ctx.stroke();
      const actItem = n ? n.item % 8 : -1;
      for (let i = 0; i < 8; i++) {
        const col = i % 2, row = Math.floor(i / 2);
        const cx0 = w * 0.05 + col * w * 0.47;
        const cy0 = h * 0.093 + row * h * 0.036;
        const it = this.ITEMS[i], bin = this.BINS[it[2]];
        if (i === actItem) {
          ctx.strokeStyle = '#FFB300'; ctx.lineWidth = 3 * u;
          U.roundRect(ctx, cx0 - 6 * u, cy0 - h * 0.017, w * 0.44, h * 0.034, 6 * u); ctx.stroke();
          ctx.fillStyle = 'rgba(255,211,77,0.25)';
          U.roundRect(ctx, cx0 - 6 * u, cy0 - h * 0.017, w * 0.44, h * 0.034, 6 * u); ctx.fill();
        }
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = (fs + 2) + 'px system-ui,sans-serif';
        ctx.fillText(it[1], cx0, cy0);
        ctx.font = '700 ' + fs + 'px system-ui,sans-serif'; ctx.fillStyle = '#5D4037';
        ctx.fillText(it[0], cx0 + fs + 6 * u, cy0);
        ctx.fillStyle = bin[1];
        U.circle(ctx, cx0 + w * 0.24, cy0, 5 * u); ctx.fill();
        ctx.font = '700 ' + fs + 'px system-ui,sans-serif'; ctx.fillStyle = '#5D4037';
        ctx.fillText(bin[0], cx0 + w * 0.24 + 8 * u, cy0);
      }
      /* 物品卡 */
      if (n) {
        const it = this.ITEMS[n.item % 8];
        ctx.fillStyle = 'rgba(255,253,244,0.95)';
        U.roundRect(ctx, w / 2 - 70 * u, h * 0.24, 140 * u, 76 * u, 14 * u); ctx.fill();
        ctx.strokeStyle = '#FFD34D'; ctx.lineWidth = 3 * u;
        U.roundRect(ctx, w / 2 - 70 * u, h * 0.24, 140 * u, 76 * u, 14 * u); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = (34 * u) + 'px system-ui,sans-serif';
        ctx.fillText(it[1], w / 2, h * 0.24 + 30 * u);
        ctx.font = '800 ' + 16 * u + 'px system-ui,sans-serif'; ctx.fillStyle = '#6b4a12';
        ctx.fillText(it[0], w / 2, h * 0.24 + 58 * u);
      }
      /* 分类站台面 + 标牌 */
      ctx.fillStyle = 'rgba(141,110,99,0.6)';
      U.roundRect(ctx, w * 0.1, h * 0.72, w * 0.8, 10 * u, 4 * u); ctx.fill();
      /* 分类站标牌（下移避免遮挡对照表） */
      ctx.fillStyle = '#FFFDF4'; U.roundRect(ctx, w * 0.36, h * 0.5, w * 0.28, h * 0.055, 8 * u); ctx.fill();
      ctx.strokeStyle = '#8D6E63'; ctx.lineWidth = 2.5 * u; U.roundRect(ctx, w * 0.36, h * 0.5, w * 0.28, h * 0.055, 8 * u); ctx.stroke();
      ctx.fillStyle = '#6b4a12'; ctx.font = '800 ' + 13 * u + 'px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('垃圾分类站', w / 2, h * 0.5275);
      /* 四桶 */
      for (let i = 0; i < 4; i++) {
        const b = this.BINS[i], x = this.binX(i), y = h * 0.66;
        const fl = now - r.m.flashT < 0.3 && r.m.flashBin === i;
        ctx.fillStyle = b[1];
        U.roundRect(ctx, x - 30 * u, y - 34 * u, 60 * u, 68 * u, 8 * u); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        U.roundRect(ctx, x - 34 * u, y - 42 * u, 68 * u, 12 * u, 5 * u); ctx.fill();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = (20 * u) + 'px system-ui,sans-serif';
        ctx.fillText(b[2], x, y - 8 * u);
        ctx.font = '800 ' + 11 * u + 'px system-ui,sans-serif'; ctx.fillStyle = '#fff';
        ctx.fillText(b[0], x, y + 18 * u);
        if (fl) {
          ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4 * u;
          U.roundRect(ctx, x - 36 * u, y - 48 * u, 72 * u, 88 * u, 10 * u); ctx.stroke();
        }
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };
})();

<script>
/* 节奏小奶蛙 - 第三阶段机制原型：keys 下落音符多轨（完整乐器画面版）
   皮肤：piano 钢琴键盘 / strings 弦乐器(吉他/贝斯/小提琴/二胡) / wind 管乐(笛/小号/口琴) / drums 架子鼓套件
   操作：点击轨道或键盘 A S D F G H J K；命中奏出对应乐器音色 */
(function () {
  const U = RF.util, J = RF.judge;
  const M = RF.mech;

  M.keys = {
    init(r) {
      const p = r.cfg.params;
      r.m = {
        lanes: p.lanes || 4, skin: p.skin || 'piano', voice: p.voice || 'piano',
        labels: p.labels || ['1', '2', '3', '4', '5', '6', '7', '8'],
        flash: [], drops: []
      };
      r.frog.prop = p.prop || null;
      r.frog.x = RF.view.w * 0.09;
      r.frog.y = r.groundY - 42 * RF.view.u;
      r.frog.s = RF.view.u * 0.8;
    },
    margin(r) { return RF.view.w * 0.1; },
    laneW(r) { const w = RF.view.w, m = this.margin(r); return (w - 2 * m) / r.m.lanes; },
    laneX(r, i) { const w = RF.view.w, m = this.margin(r), n = r.m.lanes; return m + (w - 2 * m) * (i + 0.5) / n; },
    laneY(r, i) {
      const h = RF.view.h;
      if (r.m.skin === 'drums') return h * [0.68, 0.56, 0.44, 0.6, 0.5][i % 5];
      if (r.m.skin === 'stairs') return h * 0.72 - i * h * 0.07;
      return h * 0.72;
    },
    lineY(r) { return RF.view.h * 0.72; },
    laneOfX(r, x) {
      const w = RF.view.w, m = this.margin(r), n = r.m.lanes;
      return U.clamp(Math.floor((x - m) / ((w - 2 * m) / n)), 0, n - 1);
    },
    update(r, dt) {
      const n = r.nextNote();
      if (n) { r.cueX = this.laneX(r, n.lane); r.cueY = this.laneY(r, n.lane); }
      for (let i = r.m.flash.length - 1; i >= 0; i--) { r.m.flash[i].t += dt; if (r.m.flash[i].t > 0.4) r.m.flash.splice(i, 1); }
      for (let i = r.m.drops.length - 1; i >= 0; i--) { r.m.drops[i].t += dt; if (r.m.drops[i].t > 0.7) r.m.drops.splice(i, 1); }
    },
    down(r, e) {
      if (e.lane == null && e.dir != null) return;
      const now = r.now(), u = RF.view.u;
      const lane = e.lane != null ? e.lane : this.laneOfX(r, e.x);
      let best = null, bd = 1e9;
      for (const n of r.chart.notes) {
        if (n.judged || n.lane !== lane) continue;
        const d = now - n.t;
        if (Math.abs(d) <= r.winG && Math.abs(d) < Math.abs(bd)) { bd = d; best = n; }
      }
      if (!best) { r.m.flash.push({ lane, t: 0, ok: false }); RF.sfx.whoosh(); return; }
      const tier = J.timeTier(bd, r.winS);
      r.submit(best, tier, { x: this.laneX(r, lane), y: this.laneY(r, lane) - 46 * u });
      r.m.flash.push({ lane, t: 0, ok: tier !== 'M' });
      if (tier !== 'M') {
        RF.sfx.inst(r.m.voice, lane);
        r.setPose('play', 0.25);
        r.setExpr(tier === 'P' ? 'stars' : 'happy', 0.35);
        RF.fx.burst(this.laneX(r, lane), this.laneY(r, lane), '#FFD34D', 8, { speed: 160, up: 120 });
      } else {
        r.setExpr('tense', 0.5);
        r.m.drops.push({ lane, t: 0 });
      }
    },
    up() { },
    miss(r, n) {
      r.setExpr('tense', 0.5);
      r.m.drops.push({ lane: n.lane, t: 0 });
    },
    draw(r, ctx) {
      const m = r.m, w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      const lw = this.laneW(r);
      ctx.save();
      /* 轨道背景 */
      for (let i = 0; i < m.lanes; i++) {
        const x = this.laneX(r, i), y = this.laneY(r, i);
        ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.1)';
        ctx.fillRect(x - lw / 2 + 2, h * 0.12, lw - 4, y - h * 0.12);
      }
      /* ---- 完整乐器画面 ---- */
      const kp = RF.scenes && RF.scenes['keys_' + m.skin];
      if (kp) { kp(ctx, r); }
      else if (m.skin === 'piano') {
        const ly = this.lineY(r);
        /* 琴身 */
        ctx.fillStyle = '#263238';
        U.roundRect(ctx, this.margin(r) - 10 * u, ly - 6 * u, w - 2 * this.margin(r) + 20 * u, h * 0.2, 10 * u); ctx.fill();
        for (let i = 0; i < m.lanes; i++) {
          const x = this.laneX(r, i);
          const on = m.flash.find(f => f.lane === i && f.t < 0.2);
          ctx.fillStyle = on ? '#FFE082' : '#FFFDF4';
          U.roundRect(ctx, x - lw / 2 + 4, ly + (on ? 4 * u : 0), lw - 8, h * 0.17, 5 * u); ctx.fill();
          ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5 * u;
          U.roundRect(ctx, x - lw / 2 + 4, ly + (on ? 4 * u : 0), lw - 8, h * 0.17, 5 * u); ctx.stroke();
          if (i < m.lanes - 1) { ctx.fillStyle = '#111'; U.roundRect(ctx, x + lw / 2 - 9 * u, ly, 18 * u, h * 0.1, 4 * u); ctx.fill(); }
          ctx.fillStyle = '#546E7A'; ctx.font = '700 ' + 12 * u + 'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(m.labels[i], x, ly + h * 0.14);
        }
      } else if (m.skin === 'strings') {
        const ly = this.lineY(r);
        const voice = m.voice;
        /* 琴头（顶） */
        ctx.fillStyle = '#5D4037';
        U.roundRect(ctx, this.margin(r), h * 0.1, w - 2 * this.margin(r), 16 * u, 6 * u); ctx.fill();
        for (let i = 0; i < m.lanes; i++) {
          const x = this.laneX(r, i);
          ctx.fillStyle = '#FFD34D'; U.circle(ctx, x, h * 0.1 + 8 * u, 4 * u); ctx.fill();
        }
        /* 琴身（底） */
        const bw = w * (voice === 'violin' || voice === 'erhu' ? 0.4 : 0.56), bx = w / 2, by = ly + h * 0.1;
        ctx.fillStyle = voice === 'erhu' ? '#6D4C41' : '#8D6E63';
        ctx.beginPath();
        ctx.ellipse(bx, by, bw / 2, h * 0.11, 0, 0, U.TAU); ctx.fill();
        ctx.fillStyle = '#5D4037';
        ctx.beginPath(); ctx.ellipse(bx, by, bw / 2, h * 0.11, 0, Math.PI, 0); ctx.fill();
        if (voice === 'guitar' || voice === 'bass') {
          ctx.fillStyle = '#3E2723'; U.circle(ctx, bx, by - h * 0.02, 16 * u); ctx.fill();
        }
        /* 琴桥=判定线 */
        ctx.fillStyle = '#3E2723';
        U.roundRect(ctx, this.margin(r), ly - 4 * u, w - 2 * this.margin(r), 8 * u, 4 * u); ctx.fill();
        /* 琴弦 */
        for (let i = 0; i < m.lanes; i++) {
          const x = this.laneX(r, i);
          const vib = m.flash.find(f => f.lane === i && f.t < 0.3);
          ctx.strokeStyle = 'rgba(255,249,196,0.85)'; ctx.lineWidth = (1 + i * 0.4) * u;
          ctx.beginPath(); ctx.moveTo(x, h * 0.1 + 14 * u);
          if (vib) {
            for (let yy = h * 0.12; yy < ly; yy += 14 * u) {
              ctx.lineTo(x + Math.sin(yy * 0.15 + vib.t * 60) * 5 * u * (1 - vib.t / 0.3), yy);
            }
          }
          ctx.lineTo(x, ly); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '700 ' + 12 * u + 'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(m.labels[i], x, by + h * 0.02);
        }
      } else if (m.skin === 'wind') {
        const ly = this.lineY(r) + 26 * u;
        const voice = m.voice;
        if (voice === 'trumpet') {
          ctx.strokeStyle = '#FFC107'; ctx.lineWidth = 14 * u; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(this.margin(r), ly); ctx.lineTo(w - this.margin(r) - 30 * u, ly); ctx.stroke();
          ctx.fillStyle = '#FFC107';
          ctx.beginPath(); ctx.moveTo(w - this.margin(r) - 34 * u, ly - 8 * u);
          ctx.lineTo(w - this.margin(r), ly - 26 * u); ctx.lineTo(w - this.margin(r), ly + 26 * u);
          ctx.lineTo(w - this.margin(r) - 34 * u, ly + 8 * u); ctx.closePath(); ctx.fill();
        } else if (voice === 'harmonica') {
          ctx.fillStyle = '#B0BEC5';
          U.roundRect(ctx, this.margin(r), ly - 12 * u, w - 2 * this.margin(r), 24 * u, 6 * u); ctx.fill();
          ctx.fillStyle = '#78909C';
          U.roundRect(ctx, this.margin(r), ly - 12 * u, w - 2 * this.margin(r), 8 * u, 4 * u); ctx.fill();
        } else { /* flute */
          ctx.strokeStyle = '#FFCA28'; ctx.lineWidth = 10 * u; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(this.margin(r), ly); ctx.lineTo(w - this.margin(r), ly); ctx.stroke();
        }
        for (let i = 0; i < m.lanes; i++) {
          const x = this.laneX(r, i);
          const on = m.flash.find(f => f.lane === i && f.t < 0.25);
          ctx.fillStyle = on ? '#FFF9C4' : '#4E342E';
          U.circle(ctx, x, ly, (voice === 'harmonica' ? 7 : 9) * u); ctx.fill();
          if (on) {
            ctx.strokeStyle = 'rgba(255,255,255,' + (1 - on.t / 0.25).toFixed(3) + ')'; ctx.lineWidth = 3 * u;
            U.circle(ctx, x, ly - 16 * u, (8 + on.t * 60) * u); ctx.stroke();
          }
          ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '700 ' + 12 * u + 'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(m.labels[i], x, ly + 26 * u);
        }
      } else if (m.skin === 'drums') {
        /* 架子鼓套件：每轨一件鼓/镲 */
        for (let i = 0; i < m.lanes; i++) {
          const x = this.laneX(r, i), y = this.laneY(r, i);
          const on = m.flash.find(f => f.lane === i && f.t < 0.2);
          const kind = i % 5;
          if (kind === 2 || kind === 4) {  /* 镲 */
            ctx.fillStyle = on ? '#FFF59D' : '#FFD34D';
            U.ell(ctx, x, y, lw * 0.34, 8 * u); ctx.fill();
            ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2 * u;
            U.ell(ctx, x, y, lw * 0.34, 8 * u); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40 * u); ctx.stroke();
          } else {                          /* 鼓 */
            const rr2 = kind === 0 ? lw * 0.4 : lw * 0.3;
            ctx.fillStyle = kind === 0 ? '#B71C1C' : kind === 1 ? '#1565C0' : '#6A1B9A';
            U.ell(ctx, x, y + 10 * u, rr2, rr2 * 0.75); ctx.fill();
            ctx.fillStyle = on ? '#FFF9C4' : '#ECEFF1';
            U.ell(ctx, x, y, rr2, rr2 * 0.42); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2 * u;
            U.ell(ctx, x, y, rr2, rr2 * 0.42); ctx.stroke();
          }
          ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '800 ' + 12 * u + 'px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(m.labels[i], x, y + (kind === 2 || kind === 4 ? 52 : 34) * u);
        }
      }
      /* 下落音符 */
      for (const n of r.chart.notes) {
        if (n.judged) continue;
        const dtN = n.t - now;
        if (dtN > 1.4 || dtN < -0.25) continue;
        const ly2 = this.laneY(r, n.lane);
        const k = 1 - Math.max(0, dtN) / 1.4;
        const y = dtN >= 0 ? U.lerp(h * 0.1, ly2, k) : ly2 + (-dtN) * 420 * u;
        const x = this.laneX(r, n.lane);
        ctx.save(); ctx.translate(x, y);
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 20 * u);
        g.addColorStop(0, '#FFF9C4'); g.addColorStop(1, '#FFB300');
        ctx.fillStyle = g;
        U.circle(ctx, 0, 0, 15 * u); ctx.fill();
        ctx.fillStyle = '#5D4037'; ctx.font = '900 ' + 15 * u + 'px system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('♪', 0, 1);
        ctx.restore();
      }
      /* 命中闪光 / 漏拍 */
      for (const f of m.flash) {
        const x = this.laneX(r, f.lane), y = this.laneY(r, f.lane);
        ctx.globalAlpha = 1 - f.t / 0.4;
        ctx.strokeStyle = f.ok ? '#FFD34D' : '#EF5350'; ctx.lineWidth = 4 * u;
        U.circle(ctx, x, y, (18 + f.t * 140) * u); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      for (const d of m.drops) {
        const x = this.laneX(r, d.lane);
        ctx.globalAlpha = 1 - d.t / 0.7;
        ctx.fillStyle = '#90A4AE';
        U.circle(ctx, x, this.laneY(r, d.lane) + d.t * 300 * u, 10 * u); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };
})();

</script>
<script>
/* 节奏小奶蛙 - 第五/六阶段场景画家 + 拍照姿势机制 + 关卡场景注册表 RF.scenes */
(function () {
  const U = RF.util;
  const M = RF.mech;
  const S = RF.scenes = {};

  /* ---------- 第五阶段 ---------- */
  S.chalk = function (ctx, r, upcoming) {   // 躲粉笔：黑板+讲台+飞来的粉笔
    const w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
    ctx.fillStyle = '#2E7D32';
    U.roundRect(ctx, w * 0.08, h * 0.14, w * 0.84, h * 0.3, 8 * u); ctx.fill();
    ctx.strokeStyle = '#8D6E63'; ctx.lineWidth = 6 * u;
    U.roundRect(ctx, w * 0.08, h * 0.14, w * 0.84, h * 0.3, 8 * u); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(w * 0.14, h * 0.22); ctx.lineTo(w * 0.4, h * 0.22); ctx.moveTo(w * 0.14, h * 0.3); ctx.lineTo(w * 0.34, h * 0.3); ctx.stroke();
    /* 老师 */
    ctx.fillStyle = '#5D4037';
    U.ell(ctx, w * 0.16, h * 0.5, 16 * u, 26 * u); ctx.fill();
    ctx.fillStyle = '#FFCC80'; U.circle(ctx, w * 0.16, h * 0.5 - 30 * u, 12 * u); ctx.fill();
    for (const n of upcoming) {
      const k = U.clamp(1 - (n.t - now) / 0.9, 0, 1);
      const x = U.lerp(w * 0.18, r.frog.x, k), y = U.lerp(h * 0.46, r.frog.y - 40 * u, k) - Math.sin(k * Math.PI) * 60 * u;
      ctx.save(); ctx.translate(x, y); ctx.rotate(k * 12);
      ctx.fillStyle = '#FFFDF4'; U.roundRect(ctx, -8 * u, -3 * u, 16 * u, 6 * u, 3 * u); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2 * u;
      ctx.beginPath(); ctx.moveTo(x - 20 * u, y - 8 * u); ctx.lineTo(x, y); ctx.stroke();
    }
  };
  S.note = function (ctx, r, upcoming) {   // 传纸条：教室课桌阵+举手同学+讲台老师
    const w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
    ctx.fillStyle = '#8D6E63'; U.roundRect(ctx, w * 0.78, h * 0.2, w * 0.14, h * 0.12, 4 * u); ctx.fill();
    ctx.fillStyle = '#5D4037'; U.ell(ctx, w * 0.85, h * 0.19, 12 * u, 18 * u); ctx.fill();
    ctx.fillStyle = '#FFCC80'; U.circle(ctx, w * 0.85, h * 0.16, 9 * u); ctx.fill();
    for (let gy = 0; gy < 2; gy++) for (let gx = 0; gx < 3; gx++) {

  /* ---------- 拍照姿势机制（毕业合照） ---------- */
  const J = RF.judge;
  RF.mech.pose = {
    POSES: [['剪刀手', '✌'], ['比心', '🫶'], ['点赞', '👍'], ['敬礼', '🫡']],
    answer(n) { return n.item % 4; },
    init(r) { r.m = { fb: -1, ft: -9, flashT: -9 }; r.frog.prop = null; },
    btnX(i) { return RF.view.w * (0.2 + 0.2 * i); },
    update(r, dt) {
      r.cueX = RF.view.w / 2; r.cueY = RF.view.h * 0.32;
      const n = r.nextNote();
      if (n && n.t - r.now() < 0.3 && r.m.flashT < 0) r.m.flashT = r.now();
    },
    down(r, e) {
      const now = r.now(), u = RF.view.u;
      const note = r.pending(r.winG);
      if (!note) return;
      let bi = 0, bd = 1e9;
      for (let i = 0; i < 4; i++) { const d = Math.abs(e.x - this.btnX(i)); if (d < bd) { bd = d; bi = i; } }
      const ok = bi === this.answer(note);
      const tier = ok ? J.timeTier(now - note.t, r.winS) : 'M';
      r.submit(note, tier, { x: this.btnX(bi), y: RF.view.h * 0.62 });
      r.m.fb = bi; r.m.ft = now;
      if (ok && tier !== 'M') { RF.sfx.pop(); RF.fx.confetti(this.btnX(bi), RF.view.h * 0.6, 8); r.setPose('cheer', 0.35); r.setExpr('stars', 0.5); }
      else r.setExpr('sad', 0.6);
    },
    up() { },
    miss(r, n) { r.setExpr('tense', 0.6); },
    draw(r, ctx) {
      const w = RF.view.w, h = RF.view.h, u = RF.view.u, now = r.now();
      ctx.save();
      /* 合照人群 */
      for (let row = 0; row < 2; row++) for (let i = 0; i < 6; i++) {
        const x = w * (0.16 + i * 0.136), y = h * (0.3 + row * 0.1);
        ctx.fillStyle = ['rgba(66,165,245,0.55)', 'rgba(244,143,177,0.55)', 'rgba(129,199,132,0.55)', 'rgba(255,179,0,0.55)'][(i + row) % 4];
        U.ell(ctx, x, y, 13 * u, 16 * u); ctx.fill();
        ctx.fillStyle = '#FFCC80'; U.circle(ctx, x, y - 18 * u, 10 * u); ctx.fill();
      }
      /* 姿势提示卡 */
      const n = r.chart.notes.find(nn => !nn.judged && nn.t - now < 2.4 && nn.t - now > -0.2);
      if (n) {
        const p = this.POSES[this.answer(n)];
        ctx.fillStyle = 'rgba(255,253,244,0.96)';
        U.roundRect(ctx, w / 2 - 60 * u, h * 0.14, 120 * u, 62 * u, 12 * u); ctx.fill();
        ctx.strokeStyle = '#F48FB1'; ctx.lineWidth = 3 * u;
        U.roundRect(ctx, w / 2 - 60 * u, h * 0.14, 120 * u, 62 * u, 12 * u); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = (26 * u) + 'px system-ui,sans-serif';
        ctx.fillText(p[1], w / 2, h * 0.14 + 26 * u);
        ctx.font = '800 ' + 14 * u + 'px system-ui,sans-serif'; ctx.fillStyle = '#6b4a12';
        ctx.fillText('全班比：' + p[0], w / 2, h * 0.14 + 50 * u);
      }
      /* 四姿势按钮 */
      for (let i = 0; i < 4; i++) {
        const x = this.btnX(i), y = h * 0.66;
        const fl = now - r.m.ft < 0.3 && r.m.fb === i;
        ctx.fillStyle = fl ? '#FFE082' : 'rgba(255,253,244,0.85)';
        U.roundRect(ctx, x - 36 * u, y - 30 * u, 72 * u, 60 * u, 12 * u); ctx.fill();
        ctx.strokeStyle = '#F48FB1'; ctx.lineWidth = 2.5 * u;
        U.roundRect(ctx, x - 36 * u, y - 30 * u, 72 * u, 60 * u, 12 * u); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = (22 * u) + 'px system-ui,sans-serif';
        ctx.fillText(this.POSES[i][1], x, y - 8 * u);
        ctx.font = '700 ' + 11 * u + 'px system-ui,sans-serif'; ctx.fillStyle = '#8a6a30';
        ctx.fillText(this.POSES[i][0], x, y + 16 * u);
      }
      /* 结束快门定格 */
      if (r.m.flashT > 0 && now > r.chart.duration - 1.2) {
        const k = now - (r.chart.duration - 1.2);
        if (k < 0.5) { ctx.fillStyle = 'rgba(255,255,255,' + (1 - k * 2).toFixed(3) + ')'; ctx.fillRect(0, 0, w, h); }
        ctx.fillStyle = 'rgba(60,40,10,0.85)';
        U.roundRect(ctx, w / 2 - 110 * u, h * 0.44, 220 * u, 44 * u, 10 * u); ctx.fill();
        ctx.fillStyle = '#FFF6D8'; ctx.font = '900 ' + 18 * u + 'px system-ui,sans-serif';
        ctx.fillText(' 咔嚓！毕业快乐', w / 2, h * 0.44 + 22 * u);
      }
      ctx.restore();
      M.drawFrog(r, ctx);
    }
  };
})();

  ];
  R.list = () => RF.levels || [];
  R.get = id => R.list().find(l => l.id === id);
  R.stageLevels = n => R.list().filter(l => l.stage === n).sort((a, b) => a.idx - b.idx);
  R.gi = cfg => (cfg.stage - 1) * 10 + cfg.idx;              // 全局序号 1..60
  R.stageUnlocked = n => {
    const built = R.stageLevels(n).length > 0;
    if (R.DEV_UNLOCK) return built;
    if (n === 1) return true;
    return built && RF.save.get().unlocked > (n - 1) * 10;
  };
  R.levelUnlocked = cfg => R.DEV_UNLOCK || RF.save.get().unlocked >= R.gi(cfg);
  R.nextOf = cfg => R.list().find(l => l.stage === cfg.stage && l.idx === cfg.idx + 1);
})();
