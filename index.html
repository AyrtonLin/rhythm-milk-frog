<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF3D6">
<title>节奏小奶蛙</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0c0f12;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0c0f12;}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:#ffe9b8;background:#0c0f12;font:600 17px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:2px;z-index:9;transition:opacity .5s;}
#boot .dot{width:14px;height:14px;border-radius:50%;background:#ffe9b8;animation:bl 1s infinite;}
@keyframes bl{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="boot"><div>🐸 节奏小奶蛙 · 加载中</div><div class="dot"></div></div>
<script src="src/core/util.js"></script>
<script src="src/core/save.js"></script>
<script src="src/core/judge.js"></script>
<script src="src/core/score.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/input.js"></script>
<script src="art/frog.js"></script>
<script src="art/bg.js"></script>
<script src="art/fx.js"></script>
<script src="src/mechanics/mech.js"></script>
<script src="src/mechanics/throw.js"></script>
<script src="src/mechanics/rally.js"></script>
<script src="src/mechanics/tap.js"></script>
<script src="src/mechanics/narrative.js"></script>
<script src="src/levels/stage1.js"></script>
<script src="src/levels/registry.js"></script>
<script src="src/scenes/manager.js"></script>
<script src="src/scenes/title.js"></script>
<script src="src/scenes/menu.js"></script>
<script src="src/scenes/levels.js"></script>
<script src="src/scenes/settings.js"></script>
<script src="src/scenes/game.js"></script>
<script src="src/scenes/result.js"></script>
<script src="src/scenes/stageclear.js"></script>
<script src="src/main.js"></script>
</body>
</html>
